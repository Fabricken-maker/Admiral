name: Admiral CI

# Tester och hemlighetsskanning vid varje PR och push till main.
# Driftsättning sker inte här: Netlify bygger och publicerar main automatiskt.
# Hälsokollen på VPS:en uppdateras manuellt (rsync) efter merge.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            healthcheck/package-lock.json

      - name: Installera beroenden
        run: npm ci

      - name: Funktionernas tester
        run: npm run test:functions

      - name: Installera hälsokollens beroenden
        working-directory: healthcheck
        run: npm ci

      - name: Hälsokollens tester
        working-directory: healthcheck
        run: npm test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: npm audit (information)
        run: npm audit --audit-level=moderate || true

      # Vid push jämförs mot föregående commit på main, vid PR mot PR:ens bas.
      - name: Leta efter hemligheter
        uses: trufflesecurity/trufflehog@v3.97.5
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          extra_args: --only-verified
