<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#091422"/>
      <stop offset="100%" stop-color="#060c18"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d08a08"/>
      <stop offset="100%" stop-color="#f0c040"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Subtle grid lines -->
  <line x1="0" y1="256" x2="512" y2="256" stroke="rgba(255,255,255,.04)" stroke-width="1"/>
  <line x1="256" y1="0" x2="256" y2="512" stroke="rgba(255,255,255,.04)" stroke-width="1"/>
  <!-- A lettermark — geometric construction -->
  <path d="M256 88 L400 420 H342 L308 330 H204 L170 420 H112 L256 88Z" fill="white" opacity="0.95"/>
  <!-- Crossbar cutout -->
  <path d="M222 290 H290 L276 248 H236 Z" fill="url(#bg)"/>
  <!-- Gold accent bar -->
  <rect x="148" y="406" width="216" height="7" rx="3.5" fill="url(#gold)" opacity="0.9"/>
  <!-- Tiny blue dot — Admiral brand accent -->
  <circle cx="256" cy="88" r="6" fill="#4fc3f7"/>
</svg>
