[build]
  command = "echo 'Static site - no build needed'"
  publish = "public"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/auth/register"
  to = "/.netlify/functions/auth-register-supabase"
  status = 200
  force = true

[[redirects]]
  from = "/auth/login"
  to = "/.netlify/functions/auth-login-supabase"
  status = 200
  force = true

[[redirects]]
  from = "/api/user"
  to = "/.netlify/functions/api-user"
  status = 200
  force = true

[[redirects]]
  from = "/api/setup"
  to = "/.netlify/functions/setup"
  status = 200
  force = true

[[redirects]]
  from = "/api/meta/accounts"
  to = "/.netlify/functions/meta-accounts"
  status = 200
  force = true

[[redirects]]
  from = "/api/meta/adsets"
  to = "/.netlify/functions/meta-adsets"
  status = 200
  force = true

[[redirects]]
  from = "/api/meta/campaigns"
  to = "/.netlify/functions/meta-campaigns"
  status = 200
  force = true

[[redirects]]
  from = "/api/reports"
  to = "/.netlify/functions/api-reports"
  status = 200
  force = true

[[redirects]]
  from = "/api/meta/campaign/update"
  to = "/.netlify/functions/meta-campaign-update"
  status = 200
  force = true

[[redirects]]
  from = "/api/budget/activate"
  to = "/.netlify/functions/budget-activate"
  status = 200
  force = true

[functions."budget-adjust"]
  schedule = "0 6 * * *"

[functions."nightly-health-check"]
  schedule = "0 7 * * *"

# SPA routing - all other paths go to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"

[[headers]]
  for = "/auth/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
